[workspace]
members = [".", "crates/jcode-mobile-core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared GPUI fork. Mobile pins the iOS outside-tap delivery fix.
gpui = { git = "https://github.com/1jehuang/gpui", rev = "d2a9e0f8ae74a8b28899b0a2fc68ac4c761fd364" }
gpui_platform = { git = "https://github.com/1jehuang/gpui", rev = "d2a9e0f8ae74a8b28899b0a2fc68ac4c761fd364" }
jcode-mobile-core = { path = "crates/jcode-mobile-core" }

[package]
name = "jcode-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Jcode for iPhone, written in Rust on GPUI. Runs as a phone-sized window on Linux."

[dependencies]
gpui.workspace = true
jcode-mobile-core.workspace = true
jcode-voice = { path = "../jcode/crates/jcode-voice", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
url = "2"
anyhow = "1"
futures = "0.3"
unicode-segmentation = "1"
serde_json = "1"
log = "0.4.35"
# Desktop's thinking orbs (same GPUI instance via the crates-io patch below).
gpui-thinking-orbs = { git = "https://github.com/FrancoEscob/gpui-thinking-orbs", rev = "8bb92031040688bfd24e4d6bd96c76b61ed86ad1" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSUUID", "NSError", "NSDate", "NSArray", "NSSet", "NSDictionary", "NSObject", "NSNotification", "NSOperation"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "UIApplication", "UIResponder"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory"] }

[patch.crates-io]
# Keep the orb library on the exact GPUI instance the app uses.
gpui = { git = "https://github.com/1jehuang/gpui", rev = "d2a9e0f8ae74a8b28899b0a2fc68ac4c761fd364" }
cgl = { git = "https://github.com/1jehuang/gpui", rev = "d2a9e0f8ae74a8b28899b0a2fc68ac4c761fd364" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }
