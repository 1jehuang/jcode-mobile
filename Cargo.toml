[workspace]
members = [".", "crates/jcode-mobile-core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Same GPUI fork and revision as jcode-desktop so components can be shared.
gpui = { git = "https://github.com/1jehuang/gpui", rev = "9d340283b5043e2c54f732e02803342267e71d68" }
gpui_platform = { git = "https://github.com/1jehuang/gpui", rev = "9d340283b5043e2c54f732e02803342267e71d68" }
jcode-mobile-core = { path = "crates/jcode-mobile-core" }

[package]
name = "jcode-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Jcode for iPhone, written in Rust on GPUI. Runs as a phone-sized window on Linux."

[dependencies]
gpui.workspace = true
jcode-mobile-core.workspace = true
anyhow = "1"
futures = "0.3"
unicode-segmentation = "1"
serde_json = "1"
log = "0.4.35"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui_platform.workspace = true

[patch.crates-io]
cgl = { git = "https://github.com/1jehuang/gpui", rev = "9d340283b5043e2c54f732e02803342267e71d68" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
