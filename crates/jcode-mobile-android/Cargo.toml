[package]
name = "jcode-mobile-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Android JNI adapter for the shared jcode mobile core"

[lib]
name = "jcode_mobile_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
jcode-mobile-core = { path = "../jcode-mobile-core" }
jcode-sdk = { git = "https://github.com/1jehuang/jcode", rev = "4caa8b456f46894070730e214d98e525fb1ff5f0", features = ["ssh-native"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
