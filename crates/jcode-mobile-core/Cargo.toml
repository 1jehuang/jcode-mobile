[package]
name = "jcode-mobile-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPUI-free core of jcode mobile: wire protocol, session reducer, pairing, connection. Port of the Swift JCodeKit."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
ureq = { version = "3", features = ["json"] }
russh = { version = "0.54", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }
rand_core = { version = "0.6", features = ["getrandom"] }
