[package]
name = "jcode-mobile-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPUI-free core of jcode mobile: wire protocol, session reducer, pairing, connection. Port of the Swift JCodeKit."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Direct HTTP for account deletion (same ureq the SDK already links).
ureq = { version = "3", features = ["json"] }
# Harness API client, Jcode Cloud control plane and pure-Rust SSH (iOS-safe).
jcode-sdk = { git = "https://github.com/1jehuang/jcode", rev = "18e93c1ff6eed39a41e4fbc87f50b375d91fca98", features = ["ssh-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
jcode-harness-api = { git = "https://github.com/1jehuang/jcode", rev = "18e93c1ff6eed39a41e4fbc87f50b375d91fca98" }
