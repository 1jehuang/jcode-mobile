[package]
name = "jcode-mobile-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPUI-free core of jcode mobile: wire protocol, session reducer, pairing, connection. Port of the Swift JCodeKit."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Harness API client, Jcode Cloud control plane and pure-Rust SSH (iOS-safe).
jcode-sdk = { git = "https://github.com/1jehuang/jcode", rev = "71a57691a4b93c9054dbf27a7730e7bb522fa22a", features = ["ssh-native"] }

[dev-dependencies]
jcode-harness-api = { git = "https://github.com/1jehuang/jcode", rev = "71a57691a4b93c9054dbf27a7730e7bb522fa22a" }
